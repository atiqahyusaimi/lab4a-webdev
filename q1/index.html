
<!DOCTYPE html>
<html>
<body>
    <p id="message">Welcome to my website!</p>
    <button id="changeBtn">Change Message</button>

    <script>
        function changeMessage() {
            document.getElementById("message").textContent = "Hello there!";
        }

        document.getElementById("changeBtn")
            .addEventListener("click", changeMessage);
    </script>
</body>
</html>
