
<!DOCTYPE html>
<html>
<body>
    <label for="userInput">Enter a number:</label>
    <input id="userInput" type="text">
    <button id="checkBtn">Check</button>
    <p id="result" role="status" aria-live="polite"></p>

    <script>
        function checkInput() {
            let input = document.getElementById("userInput").value.trim();
            let num = Number(input);
            let message;

            if (input === "" || !Number.isFinite(num))
                message = "Please enter a valid number!";
            else if (num < 10)
                message = "The number is lower than 10";
            else if (num > 10)
                message = "The number is higher than 10";
            else
                message = "The number is equal to 10";

            document.getElementById("result").textContent = message;
        }

        document.getElementById("checkBtn")
            .addEventListener("click", checkInput);
    </script>
</body>
</html>
